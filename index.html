<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app" id="app">
    <h1>Focus Mode</h1>
    <p class="subtitle">Layar akan terkunci sampai waktu habis</p>

    <div class="time-input">
      <input type="number" id="hours" min="0" placeholder="Jam">
      <input type="number" id="minutes" min="0" placeholder="Menit">
      <input type="number" id="seconds" min="0" placeholder="Detik">
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <button id="startBtn">Mulai Fokus</button>

    <div class="status" id="status">Belum aktif</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
