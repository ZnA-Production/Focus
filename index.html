<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Focus Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light">

  <div class="app" id="app">
    <div class="header">
      <h1>Focus Mode</h1>
      <button id="themeToggle">🌙</button>
    </div>

    <p class="subtitle">Layar akan terkunci sampai waktu habis</p>

    <!-- INPUT WAKTU -->
    <div class="time-input">
      <div class="time-box">
        <label>Jam</label>
        <input type="number" id="hours" min="0" value="0">
      </div>
      <div class="time-box">
        <label>Menit</label>
        <input type="number" id="minutes" min="0" value="0">
      </div>
      <div class="time-box">
        <label>Detik</label>
        <input type="number" id="seconds" min="0" value="0">
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <button id="startBtn">Mulai Fokus</button>

    <div class="status" id="status">Belum aktif</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
